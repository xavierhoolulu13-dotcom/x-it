services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      X_IT_DATA_DIR: /app/data
      # OpenAI-compatible provider (optional — omit for offline demo mode).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      # Sandbox: `docker` launches sibling containers through the socket below.
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-docker}
      DOCKER_HOST: unix:///var/run/docker.sock
      SANDBOX_BASE_IMAGE: ${SANDBOX_BASE_IMAGE:-x-it-sandbox:latest}
      X_IT_API_TOKEN: ${X_IT_API_TOKEN:-}
      X_IT_CHROME_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      # Durable state: users, projects, conversations, audit log, workspaces.
      - app-data:/app/data
      # Sibling sandbox containers. Remove this mount to use the hardened local
      # backend instead (the app falls back automatically when Docker is absent).
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Base image for per-project sandboxes. Built (not run) by compose.
  sandbox-builder:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: x-it-sandbox:latest
    entrypoint: ["echo", "x-it-sandbox image built"]

volumes:
  app-data:
